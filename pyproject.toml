[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendations over the Zomato dataset (see docs/)."
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "pandas>=2.2",
    "pyarrow>=16",
    "groq>=1.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "streamlit>=1.36",
    "httpx>=0.27",
]

[project.optional-dependencies]
# playwright drives the web UI tests (tests/test_web_ui.py); they skip without a browser.
dev = ["pytest>=8", "playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recommender = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
