[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendations over the Zomato dataset (see docs/)."
requires-python = ">=3.11"
# What the API server needs. Ingestion and the old Streamlit page are extras.
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "groq>=1.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# python -m recommender.ingestion.cli (downloads the Hugging Face dataset)
ingest = ["datasets>=2.20"]
# streamlit run app/streamlit_app.py
streamlit = ["streamlit>=1.36", "httpx>=0.27"]
# playwright drives the web UI tests (tests/test_web_ui.py); they skip without a browser.
dev = ["restaurant-recommender[ingest,streamlit]", "pytest>=8", "httpx>=0.27", "playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recommender = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
